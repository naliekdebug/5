[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
version = "0.1.0"
description = "A fully automated trading system built from the ground up (pure standard library)."
readme = "AUTOTRADER_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "keilan403" }]
dependencies = []   # core runs on the standard library only

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
autotrader = "autotrader.cli:main"

[tool.setuptools]
packages = ["autotrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
